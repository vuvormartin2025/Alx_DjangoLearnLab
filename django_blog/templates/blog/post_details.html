{% extends "base.html" %}
{% block content %}
<article>
  <h2>{{ object.title }}</h2>
  <p>{{ object.content }}</p>
  <small>By {{ object.author }} | {{ object.date_created|date:"M d, Y" }}</small>
</article>

{% if user == object.author %}
  <a href="{% url 'post-update' object.pk %}">Edit</a>
  <a href="{% url 'post-delete' object.pk %}">Delete</a>
{% endif %}
{% endblock %}
